<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>주중 요금 설정</title>
  <style>
    /* 기본 스타일 */
    body {
        font-family: Arial, sans-serif;
        background-color: #fff;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        margin: 0;
    }
    .container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.form-box {
  text-align: center;
  margin-top: 20px;
}
    h1 {
        color: #000;
        font-size: 24px;
    }
    form {
        text-align: center;
        width: 100%;
        max-width: 600px;
    }
    input[type="number"] {
        padding: 10px;
        width: 50%;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
    }
    .result {
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
    }
    .next-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background-color: #ff9800;
        border: none;
        padding: 15px 30px;
        font-size: 1.2rem;
        border-radius: 5px;
        color: #fff;
        cursor: pointer;
        text-decoration: none;
    }
    .next-btn:hover {
        background-color: #e68900;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>숙박 요금을 입력하세요</h1>

  <div class="form-box">
    <input type="number" id="weekDayPrice" placeholder="주중 요금을 입력하세요" min="0">
    <div class="result" id="result"></div>
  </div>

  <button type="button" class="next-btn" onclick="savePrice()">다음</button>
</div>


<script>
  const hostData = JSON.parse(localStorage.getItem("hostData")) || {};
  const weekDayPriceInput = document.getElementById('weekDayPrice');
  const resultDiv = document.getElementById('result');

  document.addEventListener("DOMContentLoaded", function () {
    if (hostData.price) {
      weekDayPriceInput.value = hostData.price;
      resultDiv.innerHTML = `₩${Number(hostData.price).toLocaleString()}`;
    }

    weekDayPriceInput.addEventListener('input', function () {
      const price = parseInt(weekDayPriceInput.value);
      if (!isNaN(price) && price > 0) {
        resultDiv.innerHTML = `₩${price.toLocaleString()}`;
      } else {
        resultDiv.innerHTML = '';
      }
    });
  });

  function savePrice() {
    const price = parseInt(weekDayPriceInput.value);

    if (isNaN(price) || price <= 0) {
      alert("유효한 숙박 요금을 입력해주세요!");
      weekDayPriceInput.focus();
      return;
    }

    hostData.price = price;
    localStorage.setItem("hostData", JSON.stringify(hostData));
    console.log("💸 저장된 숙박 요금:", hostData.price);

    window.location.href = "/user/receipt";
  }
</script>


</body>
</html>
