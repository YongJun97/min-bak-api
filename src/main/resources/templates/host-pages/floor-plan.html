<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>숙소 기본 정보 입력</title>
    <style>
        /* 전체 화면을 중앙 정렬 */
        body {
          margin: 0;
          padding: 0;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          background-color: #f0f0f0;
          font-family: Arial, sans-serif;
        }
        /* 컨텐츠를 담는 박스 */
        .container {
          background-color: #fff;
          padding: 30px 40px;
          border-radius: 8px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
          text-align: center;
        }
        h1 {
          margin-bottom: 30px;
        }
        /* 카운터 컨테이너 */
        .counter-container {
          margin-bottom: 30px;
        }
        .counter {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
        }
        .counter span.label {
          font-size: 1.2rem;
          flex: 1;
          text-align: left;
          padding-left: 10px;
        }
        /* -/+ 버튼 및 카운트 표시 영역 */
        .controls {
          display: flex;
          align-items: center;
        }
        .controls button {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          border: none;
          background-color: #ff9800;
          color: #fff;
          font-size: 1.2rem;
          cursor: pointer;
          display: flex;
          justify-content: center;
          align-items: center;
          transition: background-color 0.2s;
        }
        .controls button:hover {
          background-color: #e68900;
        }
        .controls span.count {
          display: inline-block;
          width: 50px;
          text-align: center;
          font-size: 1.2rem;
          margin: 0 10px;
        }
        /* 다음 버튼 */
        .next-btn {
          background-color: #ff9800;
          color: #fff;
          padding: 15px 30px;
          border: none;
          border-radius: 5px;
          font-size: 1.2rem;
          text-decoration: none;
          cursor: pointer;
          transition: background-color 0.2s;
        }
        .next-btn:hover {
          background-color: #e68900;
        }
    </style>
</head>
<body>
<!-- ✅ 더 이상 form 없음 -->
<div class="container">
    <h1>숙소 기본 정보를 알려주세요.</h1>

    <div class="counter-container">
        <div class="counter">
            <span class="label">게스트</span>
            <div class="controls">
                <button type="button" onclick="decrement('maxGuests')">-</button>
                <span class="count" id="maxGuestsCount">0</span>
                <button type="button" onclick="increment('maxGuests')">+</button>
            </div>
        </div>
        <div class="counter">
            <span class="label">침실</span>
            <div class="controls">
                <button type="button" onclick="decrement('bedrooms')">-</button>
                <span class="count" id="bedroomsCount">0</span>
                <button type="button" onclick="increment('bedrooms')">+</button>
            </div>
        </div>
        <div class="counter">
            <span class="label">침대</span>
            <div class="controls">
                <button type="button" onclick="decrement('beds')">-</button>
                <span class="count" id="bedsCount">0</span>
                <button type="button" onclick="increment('beds')">+</button>
            </div>
        </div>
        <div class="counter">
            <span class="label">욕실</span>
            <div class="controls">
                <button type="button" onclick="decrement('bathrooms')">-</button>
                <span class="count" id="bathroomsCount">0</span>
                <button type="button" onclick="increment('bathrooms')">+</button>
            </div>
        </div>
    </div>

    <button type="button" class="next-btn" onclick="saveFloorPlan()">다음</button>
</div>


<script>
    const hostData = JSON.parse(localStorage.getItem("hostData")) || {};

function increment(type) {
    const countEl = document.getElementById(type + 'Count');
    let count = parseInt(countEl.innerText, 10);
    if (count < 8) {
        countEl.innerText = ++count;
    }
}
function decrement(type) {
    const countEl = document.getElementById(type + 'Count');
    let count = parseInt(countEl.innerText, 10);
    if (count > 0) {
        countEl.innerText = --count;
    }
}

document.addEventListener("DOMContentLoaded", function () {
    const plan = hostData.floorPlan || {};
    document.getElementById("maxGuestsCount").innerText = plan.maxGuests || 0;
    document.getElementById("bedroomsCount").innerText = plan.bedrooms || 0;
    document.getElementById("bedsCount").innerText = plan.beds || 0;
    document.getElementById("bathroomsCount").innerText = plan.bathrooms || 0;
});

function saveFloorPlan() {
    hostData.floorPlan = {
        maxGuests: parseInt(document.getElementById("maxGuestsCount").innerText),
        bedrooms: parseInt(document.getElementById("bedroomsCount").innerText),
        beds: parseInt(document.getElementById("bedsCount").innerText),
        bathrooms: parseInt(document.getElementById("bathroomsCount").innerText)
    };

    localStorage.setItem("hostData", JSON.stringify(hostData));
    console.log("✅ 저장된 floorPlan:", hostData.floorPlan);
    window.location.href = "/user/charm";
}

</script>

</body>
</html>
