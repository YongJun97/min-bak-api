<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>숙소 검토하기</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 10px;
    }

    p {
        font-size: 16px;
        color: #555;
    }

    /* ✅ 미리보기 컨테이너 */
    .preview-container {
        width: 100%;
        max-width: 500px;
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
    }

    /* ✅ 메인 이미지 */
    .main-image {
        width: 100%;
        height: 300px;
        object-fit: cover;
        border-radius: 10px;
    }

    /* ✅ 숙소 정보 */
    .room-info {
        width: 100%;
        text-align: left;
        margin-top: 10px;
    }

    .room-info h2 {
        font-size: 18px;
        margin: 10px 0 5px;
    }

    .room-info p {
        font-size: 14px;
        color: #666;
        margin: 2px 0;
    }

    .price {
        font-size: 16px;
        font-weight: bold;
        color: #ff9800;
        margin-top: 5px;
    }

    /* ✅ 다음 버튼 */
    .next-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background-color: #ff9800;
        border: none;
        padding: 15px 30px;
        font-size: 1.2rem;
        border-radius: 5px;
        color: #fff;
        cursor: pointer;
        text-decoration: none;
    }

    .next-btn:hover {
        background-color: #e68900;
    }
  </style>
</head>
<body>

<h1>숙소 검토하기</h1>
<p>게스트에게 표시되는 정보는 다음과 같습니다. 모든 정보가 정확한지 확인하세요.</p>

<div class="preview-container">
  <!-- ✅ 이미지 -->
  <img id="roomImage" class="main-image" src="" alt="숙소 이미지 미리보기">

  <!-- ✅ 정보 -->
  <div class="room-info">
    <h2 id="roomTitle"></h2>
    <p id="roomAddress">숙소 위치가 여기에 표시됩니다.</p>
    <p id="roomPrice" class="price">₩ 숙소 가격</p>
  </div>
</div>

<a href="/user/publish" class="next-btn">다음</a>



<script>
  const hostData = JSON.parse(localStorage.getItem("hostData")) || {};

  document.addEventListener("DOMContentLoaded", () => {
  const roomImage = document.getElementById("roomImage");
  const roomTitle = document.getElementById("roomTitle");
  const roomAddress = document.getElementById("roomAddress");
  const roomPrice = document.getElementById("roomPrice");

  if (hostData.fileUrls && hostData.fileUrls.length > 0) {
    roomImage.src = hostData.fileUrls[0];
  } else {
    roomImage.src = "https://via.placeholder.com/500x300?text=No+Image";
  }

  roomTitle.textContent = hostData.title || "제목 없음";
  roomAddress.textContent = hostData.location?.fullAddress || "주소 정보 없음";

  if (hostData.price) {
    roomPrice.textContent = `₩${hostData.price.toLocaleString()} /박`;
  } else {
    roomPrice.textContent = "₩ 가격 정보 없음";
  }

  console.log("📌 숙소 미리보기 데이터:", hostData);
});

</script>


</body>
</html>
